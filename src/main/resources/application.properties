quarkus.mongodb.connection-string=${MONGODB_URI}
quarkus.mongodb.database=${MONGO_NAME}
quarkus.http.port=8081

anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.token.cookie=jwt
mp.jwt.token.header=Cookie
mp.jwt.verify.issuer=https://acme.org/issuer
quarkus.http.auth.proactive=false

# Swagger UI accessible en prod pour debug (désactivé par défaut par Quarkus hors dev mode).
# `servers` force l'URL de base utilisée par "Try it out" à passer par le bon préfixe Caddy,
# sinon les appels générés depuis Swagger UI perdraient le préfixe /api en repassant par le proxy.
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.servers=https://ms-admin.duckdns.org/api

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:5174,http://217.182.68.66:8100,https://ms-admin.duckdns.org,https://ms-bracket-front.duckdns.org
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=origin,content-type,accept,authorization,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true
